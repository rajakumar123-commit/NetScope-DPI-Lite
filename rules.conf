# ============================================================================
# rules.conf — NetScope DPI Lite blocking rules
# ============================================================================
# Format:
#   block_ip     <IPv4 address>      — drop all packets from this source IP
#   block_app    <AppName>           — drop all flows classified as this app
#   block_domain <pattern>           — substring or *.domain.com wildcard
#   block_port   <port number>       — drop traffic to this destination port
#
# Lines starting with '#' are comments. Blank lines are ignored.
# Changes take effect on next engine restart (hot-reload: future work).
# ============================================================================

# --- IP Blacklist ---
# Block traffic from the simulated rogue host in test_dpi.pcap
block_ip 192.168.1.50

# --- Application Blacklist ---
# Uncomment to block these applications engine-wide:
block_app YouTube
block_app TikTok
# block_app Facebook
# block_app Instagram

# --- Domain Patterns ---
# Substring match: blocks any SNI/Host containing this string
block_domain tiktok.com
block_domain bytedance.com
# block_domain facebook.com

# Wildcard: blocks *.example.com (www, api, cdn, etc.)
# block_domain *.betting-site.com

# --- Port Blacklist ---
# Common malware/C2 ports
block_port 4444
block_port 1337
